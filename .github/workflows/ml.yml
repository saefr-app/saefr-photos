name: ML modules
on:
  pull_request:
    paths: ['machine-learning/**', 'ml-coordinator/**', 'contracts/ml/**', 'research/ml/**', 'server-nest/**', '.github/workflows/ml.yml']
  push:
    paths: ['machine-learning/**', 'ml-coordinator/**', 'contracts/ml/**', 'research/ml/**', 'server-nest/**', '.github/workflows/ml.yml']
permissions:
  contents: read
concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server-nest/Dockerfile.test -t saefr-ml-backend-tests:ci server-nest
      - run: docker run --rm --network none saefr-ml-backend-tests:ci
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r machine-learning/requirements-dev.txt -r contracts/ml/v1/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: machine-learning
      - run: python -m unittest discover -v
        working-directory: contracts/ml/v1
      - run: python -m unittest discover -v
        working-directory: research/ml
  coordinator:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: ml-coordinator/package-lock.json}
      - run: npm ci
        working-directory: ml-coordinator
      - run: npm test
        working-directory: ml-coordinator
      - run: npm run test:integration
        working-directory: ml-coordinator
        env:
          ML_TEST_REDIS_PORT: '6379'
